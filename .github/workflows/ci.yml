name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check installed dependencies
        run: python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q src tests main.py app.py

      - name: Ruff lint and format
        run: |
          python -m pip install ruff
          python -m ruff check src/bootstrap.py tests/test_bootstrap.py
          python -m ruff format --check src/bootstrap.py tests/test_bootstrap.py
          python -m ruff check src/risk.py src/rolling.py src/stress.py src/factor.py src/dashboard.py app.py tests/test_tail_risk.py tests/test_tail_risk_dashboard.py tests/test_strategy_comparison.py tests/test_rolling.py tests/test_rolling_dashboard.py tests/test_stress.py tests/test_stress_dashboard.py tests/test_factor.py tests/test_factor_dashboard.py tests/test_app.py
          python -m ruff format --check src/risk.py src/rolling.py src/stress.py src/factor.py src/dashboard.py app.py tests/test_tail_risk.py tests/test_tail_risk_dashboard.py tests/test_strategy_comparison.py tests/test_rolling.py tests/test_rolling_dashboard.py tests/test_stress.py tests/test_stress_dashboard.py tests/test_factor.py tests/test_factor_dashboard.py tests/test_app.py

      - name: Run test suite
        run: python -m pytest -q
