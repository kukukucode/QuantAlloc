name: Optional Rust Kernel

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Python and Rust build requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "maturin>=1.10,<2"
      - name: Build native Python wheel
        run: python -m maturin build --release --manifest-path rust/Cargo.toml --out dist
      - name: Install native Python wheel
        run: python -m pip install dist/*.whl
      - name: Native integration and regression tests
        env:
          QUANTALLOC_ENGINE: rust
        run: python -m pytest -q tests/test_fast_backend.py tests/test_backtest.py
      - name: Benchmark measurements (not a performance gate)
        run: python -m benchmarks.holding_kernel
